name: Setup OmniRush.ai tests
description: Install the pinned runtimes, engine, and both workspaces
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0

    # The engine is OmniRush.ai's build of opencode 1.18.32, on a private
    # release of omnirush-ai/omnirush-cli (sha256-pinned in
    # apps/desktop/scripts/engine-release.json). The calling job passes a token
    # that can read it as OMNIRUSH_ENGINE_TOKEN.
    - name: Install OpenCode CLI
      shell: bash
      run: |
        set -euo pipefail
        sidecar_dir="$RUNNER_TEMP/opencode-sidecar"
        node apps/desktop/scripts/prepare-sidecar.mjs --outdir "$sidecar_dir"
        install_dir="$HOME/.opencode/bin"
        mkdir -p "$install_dir"
        cp "$sidecar_dir/opencode" "$install_dir/opencode"
        chmod 755 "$install_dir/opencode"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify OpenCode
      shell: bash
      run: opencode --version

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install eval workspace
      shell: bash
      run: pnpm --dir evals install --frozen-lockfile --prefer-offline
