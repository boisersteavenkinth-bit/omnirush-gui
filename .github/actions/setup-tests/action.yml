name: Setup OmniRush.ai tests
description: Install the pinned runtimes, engine, and both workspaces
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0

    - name: Install OpenCode CLI
      shell: bash
      run: |
        set -euo pipefail

        version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.opencodeVersion||'').trim().replace(/^v/,''));")"
        version="$(echo "$version" | tr -d '\r\n' | sed 's/^v//')"

        if [ -z "$version" ]; then
          echo "Unable to resolve OpenCode version from constants.json." >&2
          exit 1
        fi

        # The 2.x engine is published per platform on npm (@opencode/cli-<platform>),
        # not as GitHub release assets.
        arch="$(uname -m)"
        case "${RUNNER_OS}" in
          Linux)
            if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
              opencode_pkg="cli-linux-arm64"
            else
              opencode_pkg="cli-linux-x64-baseline"
            fi
            ;;
          macOS)
            if [ "$arch" = "arm64" ]; then
              opencode_pkg="cli-darwin-arm64"
            else
              opencode_pkg="cli-darwin-x64-baseline"
            fi
            ;;
          *)
            echo "Unsupported OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

        registry="${OPENCODE_NPM_REGISTRY:-https://registry.npmjs.org}"
        url="${registry}/@opencode/${opencode_pkg}/-/${opencode_pkg}-${version}.tgz"
        tmp_dir="$RUNNER_TEMP/opencode"
        extract_dir="$tmp_dir/extracted"
        rm -rf "$tmp_dir"
        mkdir -p "$extract_dir"

        integrity="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "${registry}/@opencode/${opencode_pkg}/${version}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).dist.integrity))")"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$tmp_dir/opencode.tgz" "$url"
        actual="sha512-$(openssl dgst -sha512 -binary "$tmp_dir/opencode.tgz" | base64 | tr -d '\n')"
        if [ "$actual" != "$integrity" ]; then
          echo "OpenCode package integrity mismatch: expected $integrity, got $actual" >&2
          exit 1
        fi
        tar -xzf "$tmp_dir/opencode.tgz" -C "$extract_dir"

        if [ -f "$extract_dir/package/bin/opencode" ]; then
          bin_path="$extract_dir/package/bin/opencode"
        else
          echo "OpenCode binary not found in package" >&2
          ls -laR "$extract_dir"
          exit 1
        fi

        install_dir="$HOME/.opencode/bin"
        mkdir -p "$install_dir"
        cp "$bin_path" "$install_dir/opencode"
        chmod 755 "$install_dir/opencode"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify OpenCode
      shell: bash
      run: opencode --version

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install eval workspace
      shell: bash
      run: pnpm --dir evals install --frozen-lockfile --prefer-offline
